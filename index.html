    :root {
      --bg: #F6F8FC;
      --card: #FFFFFF;
      --ink: #14213D;
      --mut: #5B6785;
      --line: #E3E8F2;
      --pri: #2547D0;
      --pri2: #EAEFFE;
      --ok: #16A34A;
      --ok2: #E7F6EC;
      --cur: #D97706;
      --cur2: #FEF3E2;
      --bad: #DC2626;
      --bad2: #FDECEC;
      --sh: 0 1px 3px rgba(20,33,61,.06), 0 8px 24px rgba(20,33,61,.06);
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg: #0E1424;
        --card: #171F36;
        --ink: #E8ECF7;
        --mut: #9AA6C4;
        --line: #27314D;
        --pri: #6F8BFF;
        --pri2: #202C57;
        --ok2: #14301F;
        --cur2: #3A2A10;
        --bad2: #3A1717;
        --sh: none;
      }
    }
    :root[data-theme=dark] {
      --bg: #0E1424;
      --card: #171F36;
      --ink: #E8ECF7;
      --mut: #9AA6C4;
      --line: #27314D;
      --pri: #6F8BFF;
      --pri2: #202C57;
      --ok2: #14301F;
      --cur2: #3A2A10;
      --bad2: #3A1717;
      --sh: none;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, p { margin: 0; }
    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
    h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
    h3 { font-size: 1rem; font-weight: 700; }
    .mut { color: var(--mut); font-size: .88rem; }
    button { font: inherit; cursor: pointer; border: 0; outline: none; }
    :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: .65rem 1.15rem;
      font-weight: 700;
      font-size: .9rem;
      background: var(--pri);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: filter .15s, transform .1s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.98); }
    .btn.sec { background: var(--pri2); color: var(--pri); }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn.ghost:hover { background: var(--bg); }
    .btn.sm { padding: .4rem .75rem; font-size: .82rem; border-radius: 8px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn.block { width: 100%; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 1.25rem;
      transition: box-shadow .2s;
    }
    .grid { display: grid; gap: 1rem; }
    .g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .sp { justify-content: space-between; }
    .col { display: flex; flex-direction: column; gap: 1rem; }
    .bar {
      height: 8px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      background: var(--pri);
      border-radius: 99px;
      transition: width .5s ease-out;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .2rem .6rem;
      border-radius: 99px;
      font-size: .76rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .b-done { background: var(--ok2); color: var(--ok); }
    .b-cur { background: var(--cur2); color: var(--cur); }
    .b-lock { background: var(--line); color: var(--mut); }
    .b-new { background: var(--pri2); color: var(--pri); }
    label { display: block; font-weight: 600; font-size: .86rem; margin-bottom: .3rem; }
    input, select, textarea {
      width: 100%;
      padding: .65rem .8rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: .92rem;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--pri); outline: none; }
    .field { margin-bottom: .9rem; }
    .err { color: var(--bad); font-size: .82rem; margin-top: .3rem; }
    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -.02em;
    }
    .logo b {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--pri);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }
    .auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth .l {
      background: linear-gradient(145deg, #182B7D, var(--pri));
      color: #fff;
      padding: 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .auth .l .logo b { background: #fff; color: var(--pri); }
    .auth .r { display: grid; place-items: center; padding: 2rem; }
    .auth .card { width: 100%; max-width: 440px; padding: 2.2rem; }
    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .side {
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .35rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .65rem .8rem;
      border-radius: 10px;
      color: var(--mut);
      font-weight: 600;
      text-decoration: none;
      font-size: .9rem;
      transition: background .15s, color .15s;
    }
    .nav:hover { background: var(--bg); color: var(--ink); }
    .nav.on { background: var(--pri2); color: var(--pri); font-weight: 700; }
    .main { padding: 1.5rem 2rem; max-width: 1240px; width: 100%; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 1rem; }
    .av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--pri);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: .9rem;
    }
    .ico {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--pri2);
      font-size: 1.25rem;
      flex: none;
    }
    .hero {
      background: linear-gradient(135deg, #182B7D, var(--pri));
      color: #fff;
      border: 0;
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
    }
    .dot {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: var(--pri2);
      color: var(--pri);
    }
    .dot.d { background: var(--ok); color: #fff; }
    .dot.c { background: var(--cur); color: #fff; }
    .dot.l { background: var(--line); color: var(--mut); }
    .opt {
      display: flex;
      gap: .8rem;
      align-items: flex-start;
      padding: .85rem 1rem;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      background: var(--card);
      text-align: left;
      width: 100%;
      color: var(--ink);
      transition: border-color .15s, background .15s;
    }
    .opt:hover { border-color: var(--pri); }
    .opt.sel { border-color: var(--pri); background: var(--pri2); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: left; padding: .65rem .75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--mut); font-weight: 600; font-size: .82rem; }
    .tw { overflow-x: auto; max-width: 100%; }
    .toast {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      background: #14213D;
      color: #fff;
      padding: .8rem 1.25rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: .9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      z-index: 100;
      animation: toastIn .25s ease-out;
    }
    @keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 30, .6);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 90;
      padding: 1rem;
    }
    .modal .card { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--mut); }
    .seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }
    .seg button {
      flex: 1;
      text-align: center;
      padding: .45rem .6rem;
      border-radius: 9px;
      background: transparent;
      color: var(--mut);
      font-weight: 700;
      font-size: .85rem;
      transition: background .15s, color .15s;
    }
    .seg button.on {
      background: var(--card);
      color: var(--pri);
      box-shadow: var(--sh);
    }
    .pw { position: relative; }
    .pw input { padding-right: 2.8rem; }
    .eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      font-size: 1.1rem;
      padding: .2rem .4rem;
      color: var(--mut);
    }
    @media (max-width: 860px) {
      .auth { grid-template-columns: 1fr; }
      .auth .l { display: none; }
      .app { grid-template-columns: 1fr; }
      .side { display: none; }
    }
  </style>
</head>

// Course restrictions enforcement
window.getFilteredCoursesForCampus = function(collegeId, campusId) {
  const college = window.HS_COLLEGES.find(c => c.id === collegeId);
  if (!college) return [];
  const campus = (college.campuses || []).find(cmp => cmp.id === campusId);
  if (!campus) return college.courses || [];
  
  // Strict Alliance Campus course restrictions enforcement
  if (college.id === "COL02") {
    if (campus.id === "CMP02_ASCENT") {
      // Ascent Campus: MBA only
      return (college.courses || []).filter(c => c.name.startsWith("MBA"));
    }
    if (campus.id === "CMP02_IMPACT") {
      // Impact Campus: B.Com only
      return (college.courses || []).filter(c => c.name.startsWith("B.Com"));
    }
    if (campus.id === "CMP02_CENTRAL") {
      // Central Campus: Only courses offered at Central (exclude Ascent MBA and Impact B.Com)
      return (college.courses || []).filter(c => c.campusId === "CMP02_CENTRAL" || (!c.campusId && !c.name.includes("Ascent") && !c.name.includes("Impact")));
    }
  }

  // Generic campus filtering
  if (campus.allowedCourses && campus.allowedCourses.length) {
    return (college.courses || []).filter(crs => {
      return campus.allowedCourses.some(ac => crs.name.toUpperCase().includes(ac.toUpperCase()));
    });
  }
  return college.courses || [];
};

// Computes target, saved, verified, remaining, and completion status for any college and module.
window.computeQuestionBankStats = function(collegeId, moduleId, questionsList) {
  const qList = questionsList || window.INITIAL_QUESTIONS || [];
  const target = window.HS_QUESTION_TARGET; // 50
  
  // Filter questions applicable to this college and module
  const matching = qList.filter(q => {
    const modMatch = !moduleId || q.moduleId === moduleId;
    const colMatch = !collegeId || q.collegeId === collegeId || q.collegeId === "ALL";
    const statusMatch = q.status !== "Archived";
    return modMatch && colMatch && statusMatch;
  });

  const savedCount = matching.length;
  const verifiedCount = matching.filter(q => !!q.sourceNote).length;
  const remainingCount = Math.max(0, target - savedCount);
  const completionPercentage = Math.min(100, Math.round((savedCount / target) * 100));
  const isComplete = savedCount >= target;

  return {
    targetCount: target,
    savedCount: savedCount,
    verifiedCount: verifiedCount,
    remainingCount: remainingCount,
    completionPercentage: completionPercentage,
    status: isComplete ? "Complete" : `In Progress (${savedCount}/${target})`,
    isComplete: isComplete
  };
};

// Summary report across all 8 modules for a college
window.getCollegeQuestionSummary = function(collegeId, questionsList) {
  const modules = ["MOD01", "MOD02", "MOD03", "MOD04", "MOD05", "MOD06", "MOD07", "MOD08"];
  const summary = {};
  let totalSaved = 0;

    collegeId: collegeId,
    totalTarget: totalTarget,
    totalSaved: totalSaved,
    totalRemaining: Math.max(0, totalTarget - totalSaved),
    overallPercentage: Math.round((totalSaved / totalTarget) * 100),
    moduleBreakdown: summary
  };

// js/auth.js - Authentication, User Roles & Access Control

(function(window) {

  function saveSession(user, token) {
    currentUser = user;
    sessionToken = token || ('TOK_' + Date.now());
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        user: currentUser,
        token: sessionToken,
        timestamp: Date.now()
      }));
    } catch (e) {}
  }

  // Restore session on page reload
  function restoreSession() {
    try {
      const data = localStorage.getItem(SESSION_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        if (parsed.user) {
          currentUser = parsed.user;
          sessionToken = parsed.token || '';
          
          // Verify Primary Admin elevation
          if (currentUser.email && currentUser.email.toLowerCase() === 'hsadmin@gmail.com') {
            currentUser.role = 'admin';
            currentUser.jobRole = 'Primary Admin';
            currentUser.isPrimaryAdmin = true;
          }
          return currentUser;
        }
      }
    } catch (e) {}
    return null;
  }

    try {

        // we authenticate their credentials with the backend
        let res = await fetch(CONFIG.SHEET_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'login',
            email: cleanEmail,
            password: cleanPw,
            role: reqRole
          })
        });
        let result = await res.json();

        // If backend says "This is a employee account" for hsadmin@gmail.com, authenticate via employee role
        // but immediately elevate to Primary Admin on frontend & local database!
        if (!result.ok && isPrimaryAdminAccount && cleanRole === 'admin' && /employee account/i.test(result.error)) {

      saveSession(pAdmin, 'LOCAL_ADM_' + Date.now());
      if (window.HS_DB) {
        window.HS_DB.ensurePrimaryAdminIntegrity();
        window.HS_DB.logActivity('Login', 'Primary Admin local sign-in', pAdmin);
      }
      return { ok: true, user: pAdmin, token: sessionToken };
    }

    const matchedUser = users.find(u => u.email.toLowerCase() === cleanEmail);
    if (!matchedUser) {
      return {
        ok: false,
        error: 'No account registered with this email address. Please click "Create your account" below.'
      };
    }

    if (matchedUser.password !== cleanPw) {
      return { ok: false, error: 'Incorrect password entered.' };
    }

    if (matchedUser.role !== cleanRole) {
      return {
        ok: false,
        error: `This account has ${matchedUser.role.toUpperCase()} permissions. Please select the "${matchedUser.role.charAt(0).toUpperCase() + matchedUser.role.slice(1)}" tab.`
      };
    }

    if (!matchedUser.approved) {
      return {
        ok: false,
        error: 'Your account is pending review and approval by an Administrator.'
      };
    }

    matchedUser.lastLogin = new Date().toISOString().replace('T', ' ').slice(0, 16);
    matchedUser.loginCount = (matchedUser.loginCount || 0) + 1;
    saveSession(matchedUser, 'LOCAL_' + Date.now());
    if (window.HS_DB) {
      window.HS_DB.save();
      window.HS_DB.logActivity('Login', `User ${matchedUser.name} signed in locally`, matchedUser);
    }

    return { ok: true, user: matchedUser, token: sessionToken };
  }

  // Register New User
  async function register(userData) {
    const { name, email, password, role, jobRole, dept, assignedCollegeId, mgrId } = userData;
    const cleanEmail = String(email || '').trim().toLowerCase();
    const cleanPw = String(password || '').trim();
    const cleanName = String(name || '').trim();
    const cleanRole = String(role || 'employee').toLowerCase();

    if (!cleanName || !cleanEmail || !cleanPw) {
      return { ok: false, error: 'Please fill in all mandatory account fields.' };
    }

    if (cleanPw.length < 6) {
      return { ok: false, error: 'Password must be at least 6 characters long.' };
    }

    const isEmp = cleanRole === 'employee';
    const approved = isEmp; // Employees auto-approved; managers/admins require approval

    // Check Google Sheet registration
    if (CONFIG.SHEET_URL) {
      try {
        const res = await fetch(CONFIG.SHEET_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'register',
            name: cleanName,
            email: cleanEmail,
            password: cleanPw,
            role: cleanRole,
            dept: dept || 'Sales & Counselling',
            jobRole: jobRole || (isEmp ? 'Sales Counsellor' : cleanRole),
            joined: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }),
            managerId: mgrId || ''
          })
        });
        const result = await res.json();
        if (!result.ok) {
          return { ok: false, error: result.error || 'Server registration failed.' };
        }
      } catch (e) {
        console.warn('Remote registration error:', e);
      }
    }

    // Local DB Registration
    const users = window.HS_DB.data.users;
    if (users.some(u => u.email.toLowerCase() === cleanEmail)) {
      return { ok: false, error: 'An account with this email address already exists.' };
    }

    const prefix = cleanRole === 'admin' ? 'ADM' : cleanRole === 'manager' ? 'MGR' : 'EMP';
    const newId = window.HS_DB.generateId(prefix, users);

    const newUser = {
      id: newId,
      name: cleanName,
      email: cleanEmail,
      password: cleanPw,
      role: cleanRole,
      jobRole: jobRole || (isEmp ? 'Sales Counsellor' : cleanRole),
      dept: dept || 'Sales & Counselling',
      assignedCollegeId: assignedCollegeId || 'COL02',
      mgrId: mgrId || '',
      approved: approved,
      isPrimaryAdmin: false,
      created: new Date().toISOString().replace('T', ' ').slice(0, 16),
      lastLogin: '',
      loginCount: 0
    };

    users.push(newUser);

    // If employee, create corresponding employee profile & initial progress
    if (isEmp) {
      const employees = window.HS_DB.data.employees;
      const colleges = window.HS_DB.data.colleges;
      const targetCol = colleges.find(c => c.id === (assignedCollegeId || 'COL02')) || colleges[0];
      
      const newEmp = {
        id: newId,
        name: cleanName,
        email: cleanEmail,
        dept: dept || 'Sales & Counselling',
        role: jobRole || 'Sales Counsellor',
        joined: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }),
        assignedCollegeId: targetCol ? targetCol.id : 'COL02',
        trainingPlanId: 'PLAN_' + (targetCol ? targetCol.id : 'COL02'),
        status: 'Not Started',
        mgr: mgrId || '',
        mgrName: ''
      };
      employees.push(newEmp);

      // Create initial progress for all 8 modules for this employee
      const modules = window.HS_DB.data.modules;
      modules.forEach(m => {
        window.HS_DB.data.progress.push({
          empId: newId,
          collegeId: newEmp.assignedCollegeId,
          moduleId: m.id,
          status: m.order === 1 ? 'In Progress' : 'Not Started',
          progress: 0,
          score: null,
          completedDate: null
        });
      });
    }

    window.HS_DB.save();
    window.HS_DB.logActivity('Registration', `Created ${cleanRole} account for ${cleanName} (${cleanEmail})`, newUser);

    return {
      ok: true,
      user: newUser,
      pendingApproval: !approved
    };
  }

  // Access Permission Helper
  function canAccess(userRole, targetArea) {
    if (!userRole) return false;
    if (userRole === 'admin') return true; // Admins can access everything
    if (userRole === 'manager') return targetArea === 'manager' || targetArea === 'employee';
    if (userRole === 'employee') return targetArea === 'employee';
    return false;
  }

  // Determine home route by role
  function getHomeRoute(role) {
    if (role === 'admin') return 'admin';
    if (role === 'manager') return 'manager';
    return 'dashboard';
  }

  // Restore session at startup
  restoreSession();

  // Export Auth Interface
  window.HS_AUTH = {
    getCurrentUser: () => currentUser,
    getToken: () => sessionToken,
    login: login,
    logout: clearSession,
    register: register,
    canAccess: canAccess,
    getHomeRoute: getHomeRoute,
    restoreSession: restoreSession
  };

})(window);

  <script>
// js/quiz.js - Mandatory Quiz Engine with Strict Answer Hiding & Historical Retakes
// Implements Section 12 Specification:
// - Zero immediate feedback during attempt (no green/red, no running score, no correctness)
// - Question navigation and answer changing
// - In-progress persistence across refreshes
// - Confirmation dialog before submission
// - Calculation on submission only
// - Pass/Fail result screen with exact specified messaging
// - Answer review (admin toggleable)
// - Retake Assessment & Retake with Shuffled Questions
// - Complete preservation of historical attempts

(function(window) {
  'use strict';

  const IN_PROGRESS_KEY = 'hs_quiz_in_progress_v3';

  // Shuffle array using Fisher-Yates algorithm
  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Load active in-progress attempt from LocalStorage if present
  function getActiveAttempt(empId, collegeId, moduleId) {
    try {
      const saved = localStorage.getItem(IN_PROGRESS_KEY);
      if (saved) {
        const attempt = JSON.parse(saved);
        if (attempt && attempt.empId === empId && attempt.collegeId === collegeId && attempt.moduleId === moduleId && !attempt.submitted) {
          return attempt;
        }
      }
    } catch (e) {}
    return null;
  }

  // Save active in-progress attempt to LocalStorage
  function saveActiveAttempt(attempt) {
    try {
      localStorage.setItem(IN_PROGRESS_KEY, JSON.stringify(attempt));
    } catch (e) {}
  }

  // Clear in-progress attempt upon successful submission
  function clearActiveAttempt() {
    try {
      localStorage.removeItem(IN_PROGRESS_KEY);
    } catch (e) {}
  }

  // Start or resume an assessment attempt
  function startAttempt(empId, collegeId, moduleId, options = {}) {
    const { shuffle = false, forceNew = false } = options;
    const db = window.HS_DB.data;

    // Check existing in-progress attempt unless forceNew is true
    if (!forceNew) {
      const existing = getActiveAttempt(empId, collegeId, moduleId);
      if (existing) {
        return existing;
      }
    }

    // Determine questions for this college and module
    const allQuestions = db.questions || [];
    let matching = allQuestions.filter(q => {
      const modMatch = q.moduleId === moduleId;
      const colMatch = q.collegeId === collegeId || q.collegeId === "ALL";
      const statusMatch = q.status !== "Archived";
      return modMatch && colMatch && statusMatch;
    });

    if (!matching.length) {
      // Fallback to any questions for this module
      matching = allQuestions.filter(q => q.moduleId === moduleId);
    }

    // Determine question order (shuffled or fixed)
    let selectedQuestions = matching.slice();
    if (shuffle || db.settings.shuffleQuestions) {
      selectedQuestions = shuffleArray(selectedQuestions);
    }

    // Prepare questions for attempt (Optionally shuffle options while tracking correct key)
    const preparedQuestions = selectedQuestions.map((q, idx) => {
      let optionList = q.options.slice();
      let correctOptionText = q.options[q.correctIndex];
      let optionIndices = [0, 1, 2, 3].slice(0, optionList.length);

      if (shuffle || db.settings.shuffleOptions) {
        // Shuffle option indices
        optionIndices = shuffleArray(optionIndices);
        optionList = optionIndices.map(i => q.options[i]);
      }

      // Find new correct index in shuffled optionList
      const newCorrectIndex = optionList.indexOf(correctOptionText);

      return {
        id: q.id,
        text: q.question,
        options: optionList,
        // The real answer key is stored internally on the attempt object for final scoring only,
        // never displayed to the student during the test.
        _realCorrectIndex: newCorrectIndex,
        _originalQuestionId: q.id,
        _explanation: q.explanation || '',
        marks: q.marks || 1
      };
    });

    // Determine attempt number from history
    const pastAttempts = (db.attempts || []).filter(a => a.empId === empId && a.collegeId === collegeId && a.moduleId === moduleId);
    const attemptNumber = pastAttempts.length + 1;

    const newAttempt = {
      attemptId: 'ATT_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      empId: empId,
      collegeId: collegeId,
      moduleId: moduleId,
      attemptNumber: attemptNumber,
      startTime: new Date().toISOString(),
      submittedTime: null,
      currentIndex: 0,
      userAnswers: {}, // Maps questionIndex -> selectedOptionIndex (e.g. 0, 1, 2, 3)
      questions: preparedQuestions,
      submitted: false,
      result: null
    };

    saveActiveAttempt(newAttempt);
    return newAttempt;
  }

  // Answer a question without displaying feedback
  function selectAnswer(attempt, questionIndex, selectedOptionIndex) {
    if (!attempt || attempt.submitted) return attempt;
    attempt.userAnswers[questionIndex] = selectedOptionIndex;
    saveActiveAttempt(attempt);
    return attempt;
  }

  // Navigate between questions
  function setCurrentIndex(attempt, newIndex) {
    if (!attempt) return;
    if (newIndex >= 0 && newIndex < attempt.questions.length) {
      attempt.currentIndex = newIndex;
      saveActiveAttempt(attempt);
    }
    return attempt;
  }

  // Get unanswered question indices
  function getUnansweredIndices(attempt) {
    if (!attempt) return [];
    const unanswered = [];
    attempt.questions.forEach((q, idx) => {
      if (attempt.userAnswers[idx] === undefined || attempt.userAnswers[idx] === null) {
        unanswered.push(idx + 1); // 1-based for human reading
      }
    });
    return unanswered;
  }

  // Submit and score the assessment (Backend / Engine controlled scoring)
  function submitAssessment(attempt) {
    if (!attempt || attempt.submitted) return attempt ? attempt.result : null;

    const db = window.HS_DB.data;
    const settings = db.settings;
    const passScoreRequired = settings.passMark || 80;

    let correctCount = 0;
    let incorrectCount = 0;
    let unansweredCount = 0;
    let totalMarksObtained = 0;
    let maxMarksPossible = 0;

    const detailedReview = [];

    attempt.questions.forEach((q, idx) => {
      const selected = attempt.userAnswers[idx];
      const isUnanswered = (selected === undefined || selected === null);
      const isCorrect = !isUnanswered && (selected === q._realCorrectIndex);
      const marks = q.marks || 1;

      maxMarksPossible += marks;

      if (isUnanswered) {
        unansweredCount++;
      } else if (isCorrect) {
        correctCount++;
        totalMarksObtained += marks;
      } else {
        incorrectCount++;
      }

      detailedReview.push({
        questionNumber: idx + 1,
        questionId: q.id,
        questionText: q.text,
        options: q.options,
        userSelectedOptionIndex: selected,
        userSelectedOptionText: selected !== undefined && selected !== null ? q.options[selected] : 'Not Answered',
        correctOptionIndex: q._realCorrectIndex,
        correctOptionText: q.options[q._realCorrectIndex],
        isCorrect: isCorrect,
        isUnanswered: isUnanswered,
        marksAwarded: isCorrect ? marks : 0,
        maxMarks: marks,
        explanation: q._explanation
      });
    });

    const totalQuestions = attempt.questions.length;
    const finalPercentage = totalQuestions > 0 ? Math.round((totalMarksObtained / maxMarksPossible) * 100) : 0;
    const isPassed = finalPercentage >= passScoreRequired;

    // Get College & Module names
    const college = (db.colleges || []).find(c => c.id === attempt.collegeId) || { name: 'Higher.study Training' };
    const moduleItem = (db.modules || []).find(m => m.id === attempt.moduleId) || { name: 'Module Assessment' };

    const result = {
      attemptId: attempt.attemptId,
      collegeId: attempt.collegeId,
      collegeName: college.name,
      moduleId: attempt.moduleId,
      moduleName: moduleItem.name,
      attemptNumber: attempt.attemptNumber,
      totalQuestions: totalQuestions,
      attemptedCount: totalQuestions - unansweredCount,
      correctCount: correctCount,
      incorrectCount: incorrectCount,
      unansweredCount: unansweredCount,
      marksObtained: totalMarksObtained,
      maxMarks: maxMarksPossible,
      finalPercentage: finalPercentage,
      passingScore: passScoreRequired,
      isPassed: isPassed,
      submittedAt: new Date().toISOString().replace('T', ' ').slice(0, 19),
      passMessage: "Congratulations! You have completed this module assessment. Review your results and continue to your next training module.",
      failMessage: "You have completed this module assessment, but your score is below the required passing score. Please review the training material and retake the assessment to improve your understanding.",
      detailedReview: detailedReview,
      allowReview: settings.allowAnswerReview !== false
    };

    attempt.submitted = true;
    attempt.submittedTime = result.submittedAt;
    attempt.result = result;

    // Persist permanently in DB attempts log
    db.attempts.unshift({
      id: attempt.attemptId,
      empId: attempt.empId,
      collegeId: attempt.collegeId,
      collegeName: college.name,
      moduleId: attempt.moduleId,
      moduleName: moduleItem.name,
      attemptNo: attempt.attemptNumber,
      score: finalPercentage,
      correct: correctCount,
      total: totalQuestions,
      passed: isPassed,
      date: result.submittedAt.slice(0, 10),
      time: result.submittedAt.slice(11, 16),
      resultSnapshot: result
    });

    // Update Progress for Employee
    let progressItem = db.progress.find(p => p.empId === attempt.empId && p.collegeId === attempt.collegeId && p.moduleId === attempt.moduleId);
    if (!progressItem) {
      progressItem = {
        empId: attempt.empId,
        collegeId: attempt.collegeId,
        moduleId: attempt.moduleId,
        status: 'Not Started',
        progress: 0,
        score: null,
        completedDate: null
      };
      db.progress.push(progressItem);
    }

    // If passed, mark module completed and unlock next module
    if (isPassed) {
      progressItem.status = 'Completed';
      progressItem.progress = 100;
      progressItem.score = finalPercentage;
      progressItem.completedDate = result.submittedAt.slice(0, 10);

      // Unlock next module in sequence
      const currentModOrder = moduleItem.order || 1;
      const nextMod = (db.modules || []).find(m => m.order === currentModOrder + 1);
      if (nextMod) {
        let nextProg = db.progress.find(p => p.empId === attempt.empId && p.collegeId === attempt.collegeId && p.moduleId === nextMod.id);
        if (!nextProg) {
          nextProg = {
            empId: attempt.empId,
            collegeId: attempt.collegeId,
            moduleId: nextMod.id,
            status: 'In Progress',
            progress: 0,
            score: null,
            completedDate: null
          };
          db.progress.push(nextProg);
        } else if (nextProg.status === 'Locked' || nextProg.status === 'Not Started') {
          nextProg.status = 'In Progress';
        }
      }
    } else {
      // Failed attempt
      progressItem.status = 'In Progress';
      progressItem.score = finalPercentage; // Record latest score
    }

    // Save DB & Clear Active In-Progress Attempt
    window.HS_DB.save();
    window.HS_DB.logActivity('Assessment Submitted', `${moduleItem.name} Attempt ${attempt.attemptNumber}: ${finalPercentage}% (${isPassed ? 'PASSED' : 'FAILED'})`);
    clearActiveAttempt();

    return result;
  }

  // Get historical attempts for an employee and module
  function getAttemptHistory(empId, collegeId, moduleId) {
    const db = window.HS_DB.data;
    return (db.attempts || []).filter(a => a.empId === empId && a.collegeId === collegeId && a.moduleId === moduleId);
  }

  // Export Quiz Engine
  window.HS_QUIZ = {
    getActiveAttempt: getActiveAttempt,
    startAttempt: startAttempt,
    selectAnswer: selectAnswer,
    setCurrentIndex: setCurrentIndex,
    getUnansweredIndices: getUnansweredIndices,
    submitAssessment: submitAssessment,
    getAttemptHistory: getAttemptHistory,
    clearActiveAttempt: clearActiveAttempt
  };

})(window);

  </script>

          if (res.ok) {

          const colId = hashParts[2] || 'COL02';

          if (attempt) {
            window.HS_QUIZ.selectAnswer(attempt, qIdx, optIdx);
            draw();

          const user = window.HS_AUTH.getCurrentUser();
          const hashParts = location.hash.slice(1).split('/');
          const modId = hashParts[1] || 'MOD01';
          const colId = hashParts[2] || 'COL02';
          const attempt = window.HS_QUIZ.getActiveAttempt(user.id, colId, modId);
          if (attempt) {
            window.HS_QUIZ.setCurrentIndex(attempt, qIdx);
            draw();
          }

        confirmQuizSubmission: () => {
          const user = window.HS_AUTH.getCurrentUser();
          const hashParts = location.hash.slice(1).split('/');
          const modId = hashParts[1] || 'MOD01';
          const colId = hashParts[2] || 'COL02';
          const attempt = window.HS_QUIZ.getActiveAttempt(user.id, colId, modId);

            window.HS_APP.showModal('confirmSubmitQuiz', { attempt, unanswered });

          const modId = hashParts[1] || 'MOD01';
          const colId = hashParts[2] || 'COL02';
          const attempt = window.HS_QUIZ.getActiveAttempt(user.id, colId, modId);
          if (attempt) {
            window.HS_QUIZ.submitAssessment(attempt);
            window.HS_APP.closeModal();
            draw();
          }
        },
        retakeQuiz: (modId, colId, shuffle) => {
          const user = window.HS_AUTH.getCurrentUser();
          window.HS_QUIZ.startAttempt(user.id, colId, modId, { shuffle: !!shuffle, forceNew: true });
          go(`quiz/${modId}/${colId}`);
          draw();

            w.document.close();

          }
        },
        exportCollegesJSON: () => {
          const data = JSON.stringify(window.HS_DB.data.colleges, null, 2);
          const blob = new Blob([data], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `higherstudy-28-colleges-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          toast('Colleges dataset exported successfully');
        },
        exportQuestionsCSV: () => {
          const qs = window.HS_DB.data.questions || [];
          if (!qs.length) return toast('No questions to export');
          let csv = 'ID,College,Module,Question,Option A,Option B,Option C,Option D,Correct,Marks,Explanation\n';
          qs.forEach(q => {
            const row = [
              q.id,
              q.collegeId,
              q.moduleId,
              `"${(q.question || '').replace(/"/g, '""')}"`,
              `"${(q.options[0] || '').replace(/"/g, '""')}"`,
              `"${(q.options[1] || '').replace(/"/g, '""')}"`,
              `"${(q.options[2] || '').replace(/"/g, '""')}"`,
              `"${(q.options[3] || '').replace(/"/g, '""')}"`,
              'ABCD'[q.correctIndex] || 'A',
              q.marks || 1,
              `"${(q.explanation || '').replace(/"/g, '""')}"`
            ];
            csv += row.join(',') + '\n';
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `higherstudy-question-bank-${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
          toast('Question bank exported as CSV');

            <div class="grid g4" style="margin-bottom:1rem">
              <div class="card"><div class="mut">Target per Module</div><h3>50 Questions</h3></div>
              <div class="card"><div class="mut">Total Target</div><h3>400 Questions</h3></div>
              <div class="card"><div class="mut">Saved in Bank</div><h3>${summary.totalSaved}</h3></div>
              <div class="card"><div class="mut">Remaining to Target</div><h3>${summary.totalRemaining}</h3></div>
            </div>
            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Module</th>
                    <th>Target</th>
                    <th>Saved</th>
                    <th>Remaining</th>
                    <th>Status</th>
                    <th>Progress</th>
                  </tr>
                </thead>
                <tbody>
          `;
          modules.forEach(m => {
            const st = summary.moduleBreakdown[m.id] || { savedCount: 0, remainingCount: 50, completionPercentage: 0, status: 'In Progress' };
            html += `
              <tr>
                <td><b>Module ${m.order}: ${m.name}</b></td>
                <td>50</td>
                <td><b>${st.savedCount}</b></td>
                <td>${st.remainingCount}</td>
                <td><span class="badge ${st.isComplete ? 'b-done' : 'b-cur'}">${st.status}</span></td>
                <td><div class="bar" style="width:100px"><i style="width:${st.completionPercentage}%"></i></div></td>
              </tr>
            `;
          });
          html += `</tbody></table></div>`;
          el.innerHTML = html;
        }
      };

      // Listeners
      window.addEventListener('hashchange', draw);
      window.addEventListener('DOMContentLoaded', () => {
        draw();
        if (location.hash.includes('questions')) {
          setTimeout(() => {
            if ($('#qbColSelect')) window.HS_APP.updateQuestionBankDisplay($('#qbColSelect').value);
          }, 100);
        }
      });

    })(window);
  </script>
</body>
</html>
