<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FC;--card:#fff;--ink:#14213D;--mut:#5B6785;--line:#E3E8F2;--pri:#2547D0;--pri2:#EAEFFE;--ok:#16A34A;--ok2:#E7F6EC;--cur:#D97706;--cur2:#FEF3E2;--bad:#DC2626;--bad2:#FDECEC;--sh:0 1px 2px rgba(20,33,61,.05),0 6px 20px rgba(20,33,61,.05);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}

:root[data-theme=dark]{--bg:#0E1424;--card:#171F36;--ink:#E8ECF7;--mut:#9AA6C4;--line:#27314D;--pri:#6F8BFF;--pri2:#202C57;--ok2:#14301F;--cur2:#3A2A10;--bad2:#3A1717;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}

.mut{color:var(--mut);font-size:.9rem}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.btn:hover{filter:brightness(1.1)}.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:.45rem .8rem;font-size:.85rem}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.block{width:100%}

.grid{display:grid;gap:1rem}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:1rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .6s}.bar.ok i{background:var(--ok)}.bar.cur i{background:var(--cur)}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700}
.b-done{background:var(--ok2);color:var(--ok)}.b-cur{background:var(--cur2);color:var(--cur)}.b-lock{background:var(--line);color:var(--mut)}.b-new{background:var(--pri2);color:var(--pri)}
label{display:block;font-weight:600;font-size:.88rem;margin:0 0 .3rem}
input,select{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.field{margin-bottom:1rem}.err{color:var(--bad);font-size:.84rem;margin-top:.3rem}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.15rem}.logo b{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth .l{background:var(--pri);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between}.auth .l .logo b{background:#fff;color:var(--pri)}.auth .r{display:grid;place-items:center;padding:1.5rem}.auth .card{width:100%;max-width:430px;padding:2rem}

.side{background:var(--card);border-right:1px solid var(--line);padding:1.25rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.nav{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:10px;color:var(--mut);font-weight:600;text-decoration:none;font-size:.93rem}.nav:hover{background:var(--bg)}.nav.on{background:var(--pri2);color:var(--pri)}
.main{padding:1.5rem;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;gap:1rem}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri2);font-size:1.2rem}
.hero{background:var(--pri);color:#fff;border:0}.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:#fff}.hero .btn{background:#fff;color:var(--pri)}
.cont{border:2px solid var(--cur);background:var(--cur2)}
.mod{display:flex;gap:1rem;align-items:center}.mod.lock{opacity:.6;background:var(--bg)}.mod.cur{border:2px solid var(--cur)}
.dot{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--pri2);color:var(--pri)}.dot.d{background:var(--ok);color:#fff}.dot.c{background:var(--cur);color:#fff}.dot.l{background:var(--line);color:var(--mut)}
.opt{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 1rem;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);text-align:left;width:100%;color:var(--ink)}
.opt:hover{border-color:var(--pri)}.opt.sel{border-color:var(--pri);background:var(--pri2)}.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.fb{padding:1rem;border-radius:12px}.fb.ok{background:var(--ok2);color:var(--ok)}.fb.bad{background:var(--bad2);color:var(--bad)}.fb p{color:var(--ink);margin-top:.2rem}
.vid{aspect-ratio:16/8;border-radius:14px;background:linear-gradient(135deg,#14213D,#2547D0);color:#fff;display:grid;place-items:center;text-align:center;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:.7rem;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}.tw{overflow-x:auto}
.toast{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.8rem 1.1rem;border-radius:12px;font-weight:600;z-index:60;animation:in .25s}@keyframes in{from{transform:translateY(10px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;z-index:50;padding:1rem}.modal .card{max-width:400px;width:100%}
.sk{height:90px;border-radius:16px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:2rem;color:var(--mut)}
.cert{border:3px double var(--pri);border-radius:16px;padding:2.5rem 1.5rem;text-align:center;background:var(--card)}
.mtop{display:none}.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:35}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth .l{padding:1.5rem;gap:1rem}.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .25s}.side.open{transform:none}.mtop{display:inline-block}.main{padding:1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:.8rem 0 .4rem}.seg a,.seg button{flex:1;text-align:center;padding:.4rem .5rem;border-radius:9px;border:0;background:transparent;color:var(--mut);font-weight:700;font-size:.82rem;text-decoration:none}.seg .on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:62px;border:1px solid var(--line);border-radius:10px;padding:.35rem;display:flex;flex-direction:column;gap:2px;background:var(--card)}.day b{font-size:.8rem}.day i{width:8px;height:8px;border-radius:50%}.day small{font-size:.7rem;font-weight:700}.day.today{border:2px solid var(--pri)}.dotk{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem}
.card{transition:box-shadow .2s}.card:hover{box-shadow:0 2px 4px rgba(20,33,61,.06),0 10px 28px rgba(20,33,61,.08)}.nav.on{box-shadow:inset 3px 0 0 var(--pri)}
.pw{position:relative}.pw input{padding-right:2.8rem}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:1.05rem;padding:.3rem .5rem}
</style></head><body><div id="root"></div>

<script>
/* ===== MOCK DATA (swap for Google Sheets / Make.com later; shapes mirror the sheet tabs) ===== */
const DB={
 departments:[{id:'D1',name:'Sales'}],
 roles:[{id:'R1',dept:'Sales',name:'Sales Counsellor',type:'Employee'},{id:'R2',dept:'Sales',name:'HS Manager',type:'Manager'},{id:'R3',dept:'Sales',name:'Sales Manager',type:'Manager'},{id:'R4',dept:'Sales',name:'HS Admin',type:'Admin'}],
 plans:[{id:'P1',dept:'Sales',role:'Sales Counsellor',name:'Sales Counsellor Onboarding'}],
 modules:[['Company Introduction','Who we are, our mission and how teams work together.',8],['Higher.study Services','Everything we offer students, from counselling to admissions.',10],['Lead Handling','How leads reach you and how to respond in the first hour.',12],['CRM Process','Learn how to manage student leads and update CRM records correctly.',12],['Calling Process','Structure a call from greeting to next step.',15],['Counselling Process','Understand a student\'s goals and recommend suitable options.',18],['Follow-up Process','Plan follow-ups that keep students engaged.',10],['Lead Status Management','Learn how to correctly update, manage and track student lead statuses in the CRM.',14],['Objection Handling','Respond calmly to fees, exams and location concerns.',16],['Admission Process','Documents, deadlines and handover after a student says yes.',14],['Daily Reporting','Report your day accurately and on time.',8],['Final Assessment','Certification test covering the full program.',20]].map((m,i)=>({id:'M'+String(i+1).padStart(2,'0'),plan:'P1',name:m[0],desc:m[1],order:i+1,type:i==11?'Assessment':'Lesson',duration:m[2]})),
 employees:[],
 progress:[] /* {emp,module,status,progress,score,completed} */
};
const ME=()=>DB.employees.find(e=>e.id===S.empId)||DB.employees[0];
const PR=(id)=>DB.progress.find(p=>p.emp===S.empId&&p.module===id)||{status:'Locked',progress:0,score:null,completed:null};
const done=()=>DB.progress.filter(p=>p.emp===S.empId&&p.status==='Completed').length;
const N=()=>DB.modules.length;
const pct=()=>Math.round(done()/N()*100);
const curMod=()=>DB.modules.find(m=>PR(m.id).status==='In Progress');
/* ===== MODULE CONTENT (edit here to add lessons + quiz questions). s=sections [title,text], k=takeaways, q=[question,[options],correctIndex,explanation], v=video title ===== */
let CONTENT={"M01": {"v": "", "s": [["Who we are", "Higher.study helps students choose the right course and college and supports them through admission. Our value is guidance, not just information."], ["Our mission", "Every student should finish a conversation with us clearer about their next step than when they started."], ["Our values", "Be honest about fees, eligibility and outcomes. Respect the student's family. Take ownership of every lead you are given."], ["How the team works", "Counsellors speak with students, team leaders coach and review your work, and managers set targets and remove blockers. Ask questions early."]], "k": ["Guidance comes before selling", "Honesty builds trust", "Own every lead you are given", "Ask your team leader early"], "q": [["What matters most in every student conversation?", ["The student leaves clearer about their next step", "The call is as short as possible", "The student agrees to pay", "The student receives a brochure"], 0, "Our job is to guide, so clarity for the student is the measure of a good conversation."], ["A student asks something you do not know. What do you do?", ["Guess so the call sounds smooth", "Say you will check and come back with the right answer", "Change the subject", "Tell them to search online"], 1, "A confirmed answer later is better than a wrong answer now."], ["Who coaches and reviews your work day to day?", ["The student", "The college", "Your team leader", "Nobody"], 2, "Team leaders coach counsellors and review their work."], ["Which action reflects our values?", ["Promising a seat to close faster", "Sharing fees only after payment", "Speaking only to the student, never the parents", "Being honest about fees even if it may lose the lead"], 3, "Honesty about fees builds trust and protects the student."]]}, "M02": {"v": "", "s": [["Career counselling", "One-to-one sessions to understand the student's marks, interests, budget, city preference and family expectations before any college is suggested."], ["Course and college shortlisting", "Based on the student's profile, we shortlist realistic colleges and explain eligibility, fees, location and admission route for each."], ["Admission support", "Guidance on forms, entrance exams, documents and deadlines until the seat is confirmed."], ["What we do not do", "We do not guarantee a seat, a placement or a result. We do not quote fees that the college has not confirmed."]], "k": ["Know every service and when to offer it", "Counsel before you shortlist", "Never guarantee outcomes", "Quote only confirmed fees"], "q": [["A student is unsure which course to choose. What do you offer first?", ["A career counselling session", "Admission forms", "A fee payment link", "Hostel details"], 0, "Counselling clarifies goals before colleges are suggested."], ["Which statement is safe to say to a student?", ["Your seat is guaranteed", "Admission depends on the college's process and your profile", "You will get 100% placement", "The fees will never change"], 1, "We never promise seats, placements or fixed fees."], ["When should you share a fee figure?", ["Whenever asked, from memory", "As soon as it helps close the lead", "When the college has confirmed it", "Never"], 2, "Unconfirmed fees can mislead the student and damage trust."], ["What should you understand before shortlisting colleges?", ["Only the student's phone number", "Only the budget", "Nothing, send the full list", "Marks, budget, preferred city and interests"], 3, "A good shortlist fits the whole profile."]]}, "M03": {"v": "", "s": [["Where leads come from", "Website forms, ads, WhatsApp enquiries, referrals and campus events. Know the source of each lead, because it tells you what the student already knows."], ["The first-hour rule", "Contact a new lead within one hour while their interest is fresh. If you cannot reach them, try again later the same day by call and by message."], ["Qualify in the first call", "Confirm course interest, marks, budget, preferred city and timeline. These five details decide which options fit."], ["Record everything", "Update the CRM straight after the call with what you learned and the next step."]], "k": ["Contact new leads within an hour", "Know the lead source", "Qualify with five details", "Log every attempt"], "q": [["How soon should a new lead be contacted?", ["Within one hour", "Next week", "When you find time", "Only after they call again"], 0, "Fast contact keeps the student engaged."], ["Which detail helps decide which colleges fit?", ["Their phone brand", "Budget and preferred city", "Their social media followers", "Their blood group"], 1, "Budget and city strongly narrow the options."], ["A new lead does not pick up. What is the best action?", ["Mark the lead Not Interested", "Delete the lead", "Try again later the same day and send a message", "Never contact them again"], 2, "One missed call is not a refusal."], ["Why note the lead source in the CRM?", ["It is only for reports", "It is shared with the student", "There is no reason", "It shows what the student already knows and expects"], 3, "The source shapes how you open the conversation."]]}, "M04": {"v": "", "s": [["Understanding the CRM", "The CRM is the single source of truth for every student conversation. If it is not in the CRM, it did not happen."], ["Lead Management", "Open your assigned leads each morning, sort by last contact date, and handle the oldest first."], ["Updating Lead Status", "Change the status right after each call: New, Contacted, Interested, Follow-up, Admitted or Not Interested."], ["Adding Follow-up Notes", "Write what the student said, what you promised and the next date. Notes should make sense to a teammate who has never spoken to the student."]], "k": ["Update status immediately after every call", "Always add a follow-up date", "Write notes a teammate can act on", "Work the oldest leads first"], "q": [["What should a counsellor do after speaking with a student?", ["Update the lead status", "Leave the CRM unchanged", "Delete the lead", "Wait until the end of the month"], 0, "Updating the lead status immediately keeps the CRM information accurate."], ["Where do you record what a student promised or asked for?", ["In a personal notebook", "In the CRM follow-up notes", "In a group chat", "Nowhere"], 1, "Notes in the CRM keep the whole team informed."], ["What should every follow-up note include?", ["Only a smiley", "The manager's name", "What the student said and a next date", "Nothing"], 2, "A dated next step keeps the lead moving."], ["Which leads should you handle first each morning?", ["The newest ones", "Random ones", "Only the ones you like", "The ones with the oldest last contact"], 3, "Older leads are the most likely to go cold."]]}, "M05": {"v": "", "s": [["Before the call", "Read the CRM history, note the course interest and any earlier conversation, and keep the CRM open while you speak."], ["Open the call", "Greet warmly, say your name and Higher.study, confirm it is a good time, and give the reason for your call in one sentence."], ["Ask, then advise", "Ask about marks, goals, budget, city and timeline. Listen without interrupting, then summarise what you heard before suggesting anything."], ["Close with a next step", "End with a clear action and a date, such as sending a shortlist by 5 pm. Thank the student and update the CRM."]], "k": ["Prepare before you dial", "Summarise before you advise", "Always agree a next step", "Update the CRM after the call"], "q": [["What do you do first on a call?", ["Greet, introduce yourself and check it is a good time", "Pitch a college", "Quote the fees", "Ask for documents"], 0, "A polite opening sets the tone."], ["Why summarise what the student said?", ["It fills time", "It shows you listened and checks you understood", "It ends the call faster", "There is no reason"], 1, "Summaries prevent wrong recommendations."], ["How should a call end?", ["Abruptly", "With a discount offer", "With a clear next step and a date", "With 'call me if interested'"], 2, "A dated next step keeps the student moving forward."], ["A student says it is a bad time. What do you do?", ["Continue anyway", "Hang up without a note", "Mark the lead Not Interested", "Ask for a better time and note it in the CRM"], 3, "Respecting their time keeps the relationship open."]]}, "M06": {"v": "", "s": [["Understand the whole student", "Learn their goals, strengths, family expectations, financial limits and worries. Use open questions that start with what, how or why."], ["Build a realistic shortlist", "Offer two or three options that match marks, budget and location. For each one, explain eligibility, total course fees (not only the first year) and the admission route."], ["Explain trade-offs honestly", "If a college is cheaper but farther away, or has a tougher entry, say so. Let the student and family decide with full information."], ["Involve parents", "In many families parents make the final decision. Offer a joint call and send a short written summary afterwards."]], "k": ["Ask open questions first", "Offer a short, realistic list", "Honesty over a quick sale", "Involve parents in the decision"], "q": [["How many options should you usually recommend?", ["Two or three realistic ones", "Only one", "Ten", "None"], 0, "A short list is easier to compare and decide on."], ["A student's budget is low. What do you do?", ["Ignore the budget", "Suggest options within the budget and explain the trade-offs", "End the call", "Promise a discount"], 1, "Recommendations should fit what the family can afford."], ["Which is an open question?", ["Do you have 70 percent?", "Are you free tomorrow?", "What would you like to do after graduation?", "Is the fee okay?"], 2, "Open questions bring out goals and concerns."], ["Why share the total course fees and not only the first-year fee?", ["It sounds more impressive", "It is not needed", "Other counsellors do it", "So the family can plan the full cost of the course"], 3, "Hidden later costs break trust."]]}, "M07": {"v": "", "s": [["Why follow-ups matter", "Most admissions happen after several conversations, because students compare options, wait for results and talk to their family."], ["Plan your cadence", "Follow up within a day, then on day 3 and day 7, then weekly while the lead is active. Adjust to what the student asked for."], ["Add value each time", "Each message should give something: a confirmed deadline, an answer to their question, or a useful update. Avoid messages that only say 'just checking in'."], ["Know when to stop", "If a student clearly says they are not interested, thank them, update the status and stop. Respect their decision."]], "k": ["Follow up on a schedule", "Add value in every message", "Respect a clear no", "Record every touchpoint"], "q": [["Why do we follow up with students?", ["Most admissions need several conversations", "To meet a target only", "Students never remember us", "There is no reason"], 0, "Students decide over time, so steady follow-up helps them."], ["Which message adds the most value?", ["'Just checking in.'", "'The application deadline for your course is confirmed as 15 July. Shall I help you complete the form?'", "'Call me.'", "'Hello? Are you there?'"], 1, "A specific, useful update gives the student a reason to reply."], ["A student clearly says they are not interested. What do you do?", ["Keep calling every day", "Ask a friend to call", "Thank them, update the status and stop", "Delete the lead with no note"], 2, "Respecting a clear no protects our reputation."], ["A student asks you to call after their results next week. What do you do?", ["Call tomorrow anyway", "Mark Not Interested", "Forget it", "Set a follow-up date after the results and note it"], 3, "Honouring their timing builds trust."]]}, "M08": {"v": "", "s": [["Know each status", "New: not yet contacted. Contacted: you spoke or tried. Interested: the student shows real interest. Follow-up: a next step is planned. Admitted: the seat is co
